<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My AI Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container app-shell d-flex flex-column">
    <header class="d-flex align-items-center justify-content-between py-3">
      <div>
        <h1 class="h4 mb-0">My AI Assistant</h1>
        <small class="text-muted">Ask anything. Plan, write, or think it through.</small>
      </div>
      <button id="clearBtn" class="btn btn-outline-secondary btn-sm">New chat</button>
    </header>

    <main id="chat" class="chat flex-grow-1" aria-live="polite"></main>

    <div id="chips" class="d-flex flex-wrap gap-2 pb-2">
      <button class="btn btn-sm chip">Plan my day</button>
      <button class="btn btn-sm chip">Draft a polite email</button>
      <button class="btn btn-sm chip">Explain an idea simply</button>
    </div>

    <form id="chatForm" class="input-bar d-flex gap-2 pb-3">
      <input id="msg" class="form-control" placeholder="Type a message" autocomplete="off" required>
      <button class="btn btn-primary" type="submit" id="sendBtn">Send</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
